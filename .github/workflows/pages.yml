name: Deploy architecture site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build interactive app (served from /app/)
        run: npx likec4 build --base /koti-architecture/app/ --output dist/app

      - name: Install Playwright browser (for PNG export)
        # No version pin here on purpose: npx resolves the locally installed
        # `playwright`, which npm ci pinned to exactly the version likec4
        # depends on internally. Using `playwright@latest` here would risk
        # downloading a different Chromium revision than the one likec4's
        # bundled Playwright expects, which fails fast with "Executable
        # doesn't exist".
        run: npx playwright install --with-deps chromium

      - name: Export Level 1 diagram as PNG (light + dark)
        run: |
          npx likec4 export png --filter index --flat --theme light -o /tmp/ctx-light
          npx likec4 export png --filter index --flat --theme dark -o /tmp/ctx-dark
          mkdir -p dist/assets
          cp "$(find /tmp/ctx-light -name '*.png' | head -1)" dist/assets/context-light.png
          cp "$(find /tmp/ctx-dark -name '*.png' | head -1)" dist/assets/context-dark.png

      - name: Add static landing page
        run: cp landing/index.html dist/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
